[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BAM-torch"
version = "0.1.0.dev0"
description = "Uncertainty Quantification of Bayesian Deep Learning ab initio Potentials"
authors = [
    {name = "Myung Group", email = "myung.group@gmail.com"}
]
license = {text = "LGPL-3.0"}
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "ase",
    "matscipy",
    "torch",
    "torch_scatter",
    "torch_sparse",
    "e3nn",
    "pytorch_warmup",
]

[project.urls]
Homepage = "https://github.com/myung-group/BAM-torch"

[tool.setuptools]
packages = {find = {}}
